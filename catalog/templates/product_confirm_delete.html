{% extends 'catalog_base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <img src="{{ object.preview | media_filter }}">
                    <p class="card-text">Действительно хотите удалить {{ object.name }}</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <button type="submit" class="btn btn-danger">
                        Удалить
                    </button>
                    <a
                            class="btn btn-primary"
                            href="{% url 'catalog:home' %}"
                            role="button">Отменить
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
